    \ 2330 熄灯\n\n二、劳保\n - 工作20分钟：双拳抵腰+头部回缩2*8 + 颈部伸展2*8 + 看6米以外20秒\n - CareUEyes设置为每20分钟休息70秒\n\
    \ - 每天要用牙线\n\n三、禁止\n - 禁止趴睡、禁止半躺看手机/电脑\n - 禁止看短剧/短视频/非标信息流\n - 禁止吃零食、夜宵；禁止喝含糖饮料/功能饮料（如红牛、魔爪、东鹏特饮）\n\
    \ - 禁止吸烟饮酒\n\n三、饮食\n - 早餐：面包1个+无糖豆浆1盒。（4元）\n - 午晚餐：米饭每餐100 g；素菜:荤菜:米饭=2:1:1。（8元）\n\
